
spring.application.name=pedido-service-grupo4
server.port=8071

# Conexion con Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Conexion con Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Perfil y archivo del Config Server
spring.profiles.active=dev
spring.cloud.config.name=pedido-service

# Actuator
management.endpoints.web.exposure.include=refresh,health,info

# Evita que el refresh reinicie el cliente de Eureka
eureka.client.refresh.enable=false
